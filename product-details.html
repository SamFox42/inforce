<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Детали товара | InForce</title>

    <!-- SEO -->
    <meta name="description" content="Подробная информация о товаре InForce">
    <meta name="author" content="InForce">

    <!-- Стили -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Страница товара */
        .product-details-page {
            margin-top: 100px;
            margin-bottom: 80px;
            max-width: 1200px;
        }

        .product-details-body {
            display: flex;
            gap: 40px;
            align-items: flex-start;
            flex-wrap: wrap;
            animation: fadeIn 0.6s ease forwards;
        }

        .product-details-image {
            flex: 1 1 45%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f8f8;
            border-radius: 16px;
            padding: 20px;
        }

        .product-details-image img {
            max-width: 100%;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .product-details-info {
            flex: 1 1 50%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .product-title {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .product-price {
            font-size: 1.8rem;
            color: var(--primary-color, #396AFC);
            font-weight: 700;
        }

        .product-brand, .product-compatibility {
            font-size: 1rem;
            color: #666;
        }

        .product-description p {
            line-height: 1.6;
            font-size: 1.1rem;
            color: #333;
        }

        .product-actions {
            margin-top: 20px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1rem;
            text-transform: uppercase;
            transition: 0.3s;
        }

        .btn-primary {
            background: var(--primary-color, #396AFC);
            color: #fff;
        }

        .btn-primary:hover {
            background: #2d53d6;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #ddd;
        }

        /* Анимация появления */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            .product-details-body {
                flex-direction: column;
            }
            .product-title {
                text-align: center;
            }
            .product-price {
                text-align: center;
            }
            .product-details-image {
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
<!-- Прелоадер -->
<div class="loading-overlay">
    <div class="spinner"></div>
    <p class="loading-text">Загрузка...</p>
</div>

<!-- Хедер -->
<header class="navbar" id="header">
    <div class="container">
        <div class="logo">
            <div class="logo-icon">I</div>
            <div class="logo-text"><span>In</span>Force</div>
        </div>
        <a href="index.html#products" class="btn btn-secondary">← В каталог</a>
    </div>
</header>

<!-- Контент -->
<main class="container product-details-page">
    <h1 id="product-title" class="product-title">Загрузка товара...</h1>

    <div class="product-details-body">
        <div class="product-details-image">
            <img id="product-image" src="assets/images/placeholder.jpg" alt="Изображение товара">
        </div>

        <div class="product-details-info">
            <div id="product-price" class="product-price"></div>
            <div id="product-brand" class="product-brand"></div>
            <div id="product-compatibility" class="product-compatibility"></div>
            <div id="product-description" class="product-description"><p>Описание загружается...</p></div>
            <div class="product-actions">
                <a id="product-avito" href="#" target="_blank" class="btn btn-primary">Заказать через Авито</a>
            </div>
        </div>
    </div>
</main>

<!-- Футер -->
<footer class="footer">
    <div class="container">
        <p>&copy; <span id="current-year"></span> InForce. Все права защищены.</p>
    </div>
</footer>

<!-- Скрипты -->
<script src="js/config-loader.js"></script>
<script>
    document.getElementById('current-year').textContent = new Date().getFullYear();

    document.addEventListener('DOMContentLoaded', async () => {
        const loader = new ConfigLoader();
        await loader.loadConfig();

        const productName = decodeURIComponent(window.location.hash.substring(1)).trim();
        const titleEl = document.getElementById('product-title');

        if (!productName) {
            titleEl.textContent = "Товар не найден";
            return;
        }

        const product = loader.configData.products.find(p => p.name === productName);
        if (!product) {
            titleEl.textContent = "Товар не найден";
            return;
        }

        // Заполняем данные
        titleEl.textContent = product.name;
        document.getElementById('page-title').textContent = `${product.name} | InForce`;
        document.getElementById('product-price').textContent = `${product.price} ₽`;
        document.getElementById('product-brand').innerHTML = `<strong>Бренд:</strong> ${product.brand}`;
        document.getElementById('product-compatibility').innerHTML = `<strong>Совместимость:</strong> ${product.compatibility}`;
        document.getElementById('product-description').innerHTML = `<p>${product.description}</p>`;
        document.getElementById('product-image').src = product.mainImage || 'assets/images/placeholder.jpg';
        document.getElementById('product-avito').href = product.avitoLink || '#';

        // Прелоадер убрать
        const overlay = document.querySelector('.loading-overlay');
        overlay.classList.add('hidden');
        setTimeout(() => overlay.style.display = 'none', 500);
    });
</script>
</body>
</html>
